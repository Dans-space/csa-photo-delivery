<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DanRec STUDIO — CSA Photo Delivery</title>
    <meta name="description" content="Your photos are ready. Professional photo delivery by DanRec STUDIO.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="loader" class="loader">
        <div class="loader-content">
            <div class="loader-logo">DanRec</div>
            <div class="loader-bar"><div class="loader-progress"></div></div>
        </div>
    </div>

    <nav id="nav" class="nav">
        <div class="nav-inner">
            <a href="#/" class="nav-brand">DanRec STUDIO</a>
            <div id="breadcrumb" class="breadcrumb"></div>
        </div>
    </nav>

    <main id="app">

        <section id="view-landing" class="view active">
            <div class="hero hero--full" id="landing-hero">
                <div class="hero__overlay"></div>
                <div class="hero__content">
                    <p class="hero__eyebrow">Your photos are ready</p>
                    <h1 class="hero__title" id="shoot-title"></h1>
                    <p class="hero__subtitle" id="shoot-info"></p>
                    <div class="hero__scroll">
                        <span>Explore</span>
                        <svg width="16" height="24" viewBox="0 0 16 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <line x1="8" y1="0" x2="8" y2="20"/>
                            <polyline points="2 14 8 20 14 14"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="container">
                <div class="section-header reveal">
                    <h2>Collections</h2>
                    <p>Select a collection to browse</p>
                </div>
                <div class="categories-grid" id="categories-container"></div>
            </div>
        </section>

        <section id="view-category" class="view">
            <div class="hero hero--half" id="category-hero">
                <div class="hero__overlay"></div>
                <div class="hero__content">
                    <p class="hero__eyebrow" id="category-eyebrow"></p>
                    <h1 class="hero__title" id="category-title"></h1>
                    <p class="hero__subtitle" id="category-count"></p>
                </div>
            </div>
            <div class="container">
                <div class="person-grid" id="people-container"></div>
            </div>
        </section>

        <section id="view-person" class="view">
            <div class="hero hero--slim" id="person-banner">
                <div class="hero__overlay"></div>
                <div class="hero__content">
                    <h1 class="hero__title" id="person-name"></h1>
                    <p class="hero__subtitle" id="person-photo-count"></p>
                </div>
            </div>
            <div class="container">
                <div class="action-bar" id="person-actions">
                    <a href="#" class="btn btn--primary" id="btn-download" target="_blank" rel="noopener">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Download All
                    </a>
                    <a href="#" class="btn btn--secondary" id="btn-lightroom" target="_blank" rel="noopener">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
                            <polyline points="15 3 21 3 21 9"/>
                            <line x1="10" y1="14" x2="21" y2="3"/>
                        </svg>
                        View on Lightroom
                    </a>
                </div>
                <div class="photo-grid" id="photos-container"></div>
            </div>
        </section>

    </main>

    <div id="lightbox" class="lightbox">
        <button class="lightbox__close" aria-label="Close">&times;</button>
        <button class="lightbox__prev" aria-label="Previous photo">&#8249;</button>
        <button class="lightbox__next" aria-label="Next photo">&#8250;</button>
        <div class="lightbox__stage">
            <img id="lightbox-img" src="" alt="">
        </div>
        <div class="lightbox__counter" id="lightbox-counter"></div>
    </div>

    <footer class="footer">
        <div class="footer__inner">
            <p>&copy; <span id="footer-year"></span> DanRec STUDIO</p>
            <p class="footer__note">Delivered with care</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
